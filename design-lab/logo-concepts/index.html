<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinPilot logo concepts</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --light: #f3f6f6; --ink: #0d2a30; --dark: #0d1024; --on-dark: #f2f3fc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9eeee; color: var(--ink); font: 15px/1.5 Rubik, system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font: 700 22px Unbounded, sans-serif; margin: 0 0 4px; }
  .lede { margin: 0 0 22px; color: #48616a; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 18px; overflow: hidden; border: 1px solid #d3dfe0; }
  .card h2 { font: 700 16px Unbounded, sans-serif; margin: 0; padding: 14px 16px 2px; }
  .card p { margin: 0; padding: 0 16px 12px; color: #48616a; font-size: 13.5px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .tile { display: grid; place-items: center; gap: 14px; padding: 18px 10px; }
  .tile.light { background: var(--light); color: var(--ink); }
  .tile.dark { background: var(--dark); color: var(--on-dark); }
  .big { width: 120px; height: 120px; }
  .lockup { display: flex; align-items: center; gap: 9px; font: 700 18px Unbounded, sans-serif; letter-spacing: -0.02em; }
  .lockup svg { width: 28px; height: 28px; }
  .fav { display: flex; align-items: end; gap: 12px; }
  .fav svg:nth-child(1) { width: 16px; height: 16px; }
  .fav svg:nth-child(2) { width: 24px; height: 24px; }
  .fav svg:nth-child(3) { width: 32px; height: 32px; }
  .size { font-size: 11px; opacity: .6; }
  .pick { outline: 3px solid #ff6a2b; outline-offset: -3px; }
  .badge { display: inline-block; margin: 0 16px 12px; font-weight: 600; color: #b13f0c; font-size: 13px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="waymark" viewBox="0 0 64 64" fill="none"><path d="M13 54V12h32" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 33h12a10.5 10.5 0 0 0 0-21" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="12" r="5" fill="#FF6A2B"/></symbol>
  <symbol id="heading" viewBox="0 0 64 64" fill="none"><g transform="rotate(42 32 32)" stroke-linejoin="round" stroke-width="2.5"><path d="M30.6 5 L19 40 L30.6 58 Z" fill="#FF6A2B" stroke="#FF6A2B"/><path d="M33.4 5 L45 40 L33.4 58 Z" fill="currentColor" stroke="currentColor"/></g></symbol>
  <symbol id="orbit" viewBox="0 0 64 64" fill="none"><path d="M32 9a23 23 0 1 0 23 23" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="48.3" cy="15.7" r="5" fill="#FF6A2B"/><circle cx="32" cy="32" r="7.5" fill="#8FD0FF"/></symbol>
</svg>
<main>
  <h1>FinPilot logo concepts</h1>
  <p class="lede">Three original marks, shown large, as the header lockup, and at favicon sizes (16, 24, 32px), on the light and the Midnight Indigo backgrounds. Not applied to the app until one is approved.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  const concepts = [
    { id: "waymark", name: "1 · Waymark", note: "An FP monogram: the F’s middle bar curves up into its top bar to close a P, and the top bar runs on to a tangerine waypoint." },
    { id: "heading", name: "2 · Heading", note: "A navigation needle split along its course, tangerine and ink, set on a forward bearing. Direction without a literal arrow." },
    { id: "orbit", name: "3 · Orbit", note: "A route three quarters complete, arriving at a tangerine waypoint; the sky dot is where you stand. Progress, not a chart." },
  ];
  const use = (id, cls = "") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  document.getElementById("grid").innerHTML = concepts.map((c) => `
    <section class="card${c.id === "orbit" ? " pick" : ""}">
      <h2>${c.name}</h2><p>${c.note}</p>${c.id === "orbit" ? '<span class="badge">Recommended</span>' : ""}
      <div class="pair">
        <div class="tile light">${use(c.id, "big")}</div>
        <div class="tile dark">${use(c.id, "big")}</div>
        <div class="tile light"><span class="lockup">${use(c.id)}FinPilot</span><span class="size">Header, 28px</span></div>
        <div class="tile dark"><span class="lockup">${use(c.id)}FinPilot</span><span class="size">Header, 28px</span></div>
        <div class="tile light"><span class="fav">${use(c.id)}${use(c.id)}${use(c.id)}</span><span class="size">16 · 24 · 32px</span></div>
        <div class="tile dark"><span class="fav">${use(c.id)}${use(c.id)}${use(c.id)}</span><span class="size">16 · 24 · 32px</span></div>
      </div>
    </section>`).join("");
</script>
</body>
</html>
